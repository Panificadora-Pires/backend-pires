name: HML — teste de redefinicao segura de senhas
on:
  push:
    branches:
      - fix/hml-redefinir-senhas-contas
      - deploy/pr6-hml-asgi
  pull_request:
    branches:
      - deploy/pr6-hml-asgi
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hml-password-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBUG: "True"
      SECRET_KEY: "test-only-unsafe-not-production"
      DATABASE_URL: "sqlite:///db.sqlite3"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      CLOUDINARY_URL: ""
      GOOGLE_CLIENT_ID: ""
      MERCADO_PAGO_ACCESS_TOKEN: ""
      MERCADO_PAGO_WEBHOOK_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pdm>=2.25,<3'
      - run: |
          pdm use -f "$(command -v python)"
          pdm sync --prod
      - name: Django checks
        run: pdm run python manage.py check
      - name: Testar redefinicao sem credenciais nem servicos reais
        run: pdm run python manage.py test realtime.test_redefinir_senhas_hml --noinput --verbosity 2
