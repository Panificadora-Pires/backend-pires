# Temporário: regenerar locks PDM para driver WS do PR6A.1.
name: PR6A1 WS Lock
on:
  push:
    branches: [feat/pr6a1-channels-infra]
    paths:
      - pyproject.toml
      - .github/workflows/pr6a1-lock-wsproto.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/feat/pr6a1-channels-infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr6a1-channels-infra
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pdm>=2.25,<3'
      - name: Resolve locked WebSocket driver dependencies
        run: |
          pdm use -f "$(command -v python)"
          pdm lock
          pdm export -o requirements.txt --without-hashes
      - name: Commit generated artifacts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdm.lock requirements.txt
          if ! git diff --cached --quiet; then
            git commit -m "build(pr6a1): atualizar lock PDM com wsproto"
            git push origin HEAD:feat/pr6a1-channels-infra
          fi
